# **************************************************************************************************************
# MAESTRO simulation template
# **************************************************************************************************************

# Master random seed for reproducibility, to be sent to all beats that can receive seed
seed: 0

# ------------------------------------------------------------------------------------------------------------
# Plasma
# ------------------------------------------------------------------------------------------------------------

plasma:

  # Initialization of profiles
  profiles_initialization:

    # How to initialize the boundary and q-profile. Options:
    #       geqdsk:     use a GEQDSK file directly
    #       freegs:     use FREEGS to create an equilibrium from boundary parameters
    #       fibe:       use FIBE to create an equilibrium from boundary parameters, requires geqdsk file to specify f and pressure profiles
    #       separatrix: create separatrix from parameters (or RZ file) and guess internal equilibrium or use internal_flux_file
    #       profiles:   use an input.gacode file to initialize both equilibrium and profiles
    initialization_type: freegs      

    # How to initialize the profiles. Options:
    #       eped_initializer: use EPED-based profile initializer (must exist as beat namelist below)
    #       fixed_profiles:   use fixed profiles from a JSON file
    #       fixed_bc:         use user-specified boundary conditions (rho_bc, Te_bc, Ti_bc, ne_bc); can still match BetaN and nu_ne via gradient optimization
    #       null:             use whatever the initialization_type method provides
    creator_type: eped_initializer

    parameters:

      # If creator_type = eped_initializer: profiles are initialized to match this BetaN.
      # Can also be a confinement-scaling string ("H98y2" or "H89p", optionally "H98y2=1.1"):
      # BetaN is then inverted from that scaling (see run_maestro.estimate_BetaN_from_scaling)
      BetaN: 1.0    # Normalized global beta (number, or confinement-scaling string)
      nu_ne: 1.3    # Density peaking
      aLTe_to_aLTi_ratio: 1.0  # Keep this ratio during the BetaN optimization
      aLT: null     # [Optional] Use this a/LTi directly (aLTe = aLTe_to_aLTi_ratio * aLTi), skipping the BetaN optimization
      aLn: null     # [Optional] Use this a/Lne directly, skipping the nu_ne optimization
      nresol: 501   # Radial resolution (number of points) of the created profiles

      # If creator_type = fixed_bc: User-specified boundary condition values at x_bc
      #   - x_bc + bc_coordinate, Te_bc, Ti_bc fix the pedestal-top values; Tsep and nsep come from Tesep_eV and ne_ratio_sep_ped above
      #   - BetaN and nu_ne (above) are still matched by adjusting aLT and aLn; set them to null to use aLT/aLn directly
      x_bc: null           # BC location value in bc_coordinate (e.g. pedestal top, typically ~0.95)
      bc_coordinate: "rho" # 'rho' (rho_tor) recommended; 'roa'/'psin' unreliable at init (see creator_from_fixed_bc in MAESTRObeat.py)
      Te_bc: null          # Te at x_bc (keV)
      Ti_bc: null          # Ti at x_bc (keV); if null, uses Te_bc
      # Note: for fixed_bc, neped_20 (from plasma.parameters above) is used directly as ne_bc

      # If initialization_type = profiles: path to profiles file (input.gacode) to initialize with
      # If creator_type = fixed_profiles:  path to profiles file (json) to initialize with
      profiles_file: null

  parameters:

    # Global plasma parameters (if initialization_type = geqdsk, Bt and Ip must be null, otherwise they will override the geqdsk values)
    Bt: 12.2 
    Ip: 8.7 

    # Profile boundary conditions
    neped_20: 2.5           # Density at "ped" location as defined by EPED
    fGped: null             # [Optional] if not null, use this pedestal Greenwald fraction (OVERRIDES neped_20).
                            #            Needs Ip and a; only initialization_type=geqdsk can source a missing one
                            #            from the equilibrium file (explicit values still win)
    ne_ratio_sep_ped: 0.3   # Ratio nsep/nped 
    Tesep_eV: 75.0          # Temperature at separatrix (to potentially change if beat provides physics for this, e.g. Lengyel)

    # Separatrix specification (parameters determined depending on initialization_type)
    separatrix:

      # If initialization_type = freegs, fibe, separatrix: Boundary parameterization (or, alternatively, path to RZ boundary file if "separatrix" mode)
      R: 1.85
      a: 0.57
      delta_sep: 0.57
      kappa_sep: 1.97
      zeta_sep: 0.0  # Can be left as null to use the squareness of the internal_flux_file, if provided

      rz_boundary_file: null # [Optional] CSV (columns R,Z) with the separatrix points; overrides the scalars above and carries the FULL MXH moments of the fitted boundary (not just kappa/delta/zeta), so strongly-shaped boundaries are not over-rounded

      # [Optional] If initialization_type = separatrix: path to input.gacode to reproduce internal flux surfaces and other moments
      internal_flux_file: null

      # If initialization_type = geqdsk, freegs, separatrix: MXH order used in TWO places:
      #   1. the equilibrium->input.gacode conversion at initialization (low order ROUNDS the near-X-point boundary)
      #   2. smoothing of the boundary handed to TRANSP (first TRANSP beat only; see boundary_surface_psin)
      n_mxh: 5

      # psi_N of the flux surface used as the FIXED TRANSP boundary. 1.0 = separatrix; < 1
      # (e.g. 0.995) backs off to a rounder surface, avoiding TRANSP's boundary-curvature abort
      # on sharp/near-X-point separatrices. CONSUMED BY THE FIRST TRANSP BEAT ONLY: the curve is
      # frozen and reused verbatim thereafter (re-applying would compound the shrink each beat;
      # see TRANSPbeat._freeze_boundary_for_transp)
      boundary_surface_psin: 1.0

      # If initialization_type = geqdsk, freegs, fibe: how the 99.5% shaping (kappa, delta, zeta)
      # fed to EPED is extracted -- ONCE at initialization, then FROZEN for every EPED beat
      # (WHEN it is re-frozen is maestro.refreeze_995_after_beat below). Options:
      #      analytic:                Analytical formulas (not best-fit) to Turnbull-Miller parameters
      #      analytic_interpolation:  Same, but interpolating the coefficients at psiN=0.995
      #      turnbull:                Turnbull-Miller parameterization via best-fit
      #      mxh:                     MXH parameterization via best-fit (also stores s_three/s_four995)
      #      null:                    Do NOT freeze: each EPED beat recomputes from its own equilibrium
      # With initialization_type = separatrix only null vs non-null is honored (plain interpolation
      # of the built profiles; a runtime warning is printed)
      freeze_995_from: analytic

      # psi_N at which the "995" shaping (kappa995/delta995/zeta995/s_three995/s_four995) is sampled.
      # The dict keys/labels stay named "995"; only the extraction surface moves. Default 0.995 =
      # current behavior. Raising it toward the separatrix (e.g. 0.998) yields a higher kappa/delta.
      shaping_extraction_psin: 0.995

      # If initialization_type = geqdsk or fibe: path to file
      geqdsk_file: ""

  # Plasma mix
  species:
  
    # Main fuel species
    fuel: ['D', 'T']      # Only ['D', 'T'] or ['D'] allowed for now
      
    # Impurity species
    Zeff: 1.5
    
    mix:
      # Parameters to be used to find lumped low-Z impurity species that matches Zeff (accounting for minority species as well)
      fmain: 0.85
      highZ: W
      fhighZ: 1.5e-5
      CShighZ_estimate: 50    # Estimate of the charge state of high-Z impurity, to compute the lumped low-Z impurity at initialization
      
  # Heating parameters
  heating:

    # Heating model. Options:
    #       ICRH:             Ion Cyclotron Resonance Heating model in TRANSP
    #       NBI:              Neutral Beam Injection model in TRANSP
    #       gaussian_sources: Simple Gaussian heating sources for electrons and ions
    type: ICRH

    # Heating model parameters
    parameters:

      # ~~~~~~~~~~~
      # Parameters ICRF (type = ICRH)
      # ~~~~~~~~~~~

      # Total input power
      P_icrh: 11.0

      # Minority species [Z,A]
      minority: [2, 3]

      # Minority fraction to be added to the mix. Also honored when type = gaussian_sources:
      # fmini > 0 forces Pich on (TORIC at the full P_icrh) so the minority is evolved
      # self-consistently; the gaussian Pe/Pi replace the heating at TRANSP output (see TRANSPbeat.py)
      fmini: 0.05

      # Antenna frequency (MHz)
      #     (only if tokamak_structures is null, otherwise it will be taken from the machine structures definition)
      freq_ICH: null    # If null, estimate on-axis deposition based on field and minority species resonance


      # ~~~~~~~~~~~
      # Parameters NBI (type = NBI)
      # ~~~~~~~~~~~

      # Total input power
      P_nbi: 11.0

      # ~~~~~~~~~~~
      # Parameters for simple Gaussian sources (type = gaussian_sources)
      #     Source DENSITIES are built with the current volume integrals: if the equilibrium
      #     changes across beats, the actual Pe/Pi delivered can change.
      # ~~~~~~~~~~~
      nu_source: 5.0  # Peaking factor for the source profile
      Pe: 11.0        # Total electron heating power
      Pi: 5.0         # Total ion heating power


# ------------------------------------------------------------------------------------------------------------
# MAESTRO workflow parameters
# ------------------------------------------------------------------------------------------------------------

maestro:

  # Sequence of beats
  beats: ["transp", "eped", "portals", "eped", "portals"]

  # How much on-disk material to discard as the run proceeds (per-beat/plot details in the
  # pruning-levels block of MAESTRObeat.py). `beat_results/` is preserved at EVERY level (except
  # the PORTALS pass at level 3) — it carries the canonical state for the next beat and restart.
  #   0 : keep everything (the old `keep_all_files: true`)
  #   1 : drop execution scratch nothing reads back; mitim_plot_maestro still FULLY intact
  #   2 : 1 + wipe each beat's `run_<name>/` entirely (two plot tabs degrade gracefully)
  #   3 : 2 + prune persisted outputs and initializers (the old `keep_all_files: false`)
  # Use `mitim_prune_maestro <folder> --level N` to apply a level to an ALREADY-FINISHED run.
  # MINUET beats persist run.minuet + minuet_results.npy into beat_results/, so their
  # plot tabs and mitim_plot_minuet survive pruning of `run_minuet/`.
  prune_level: 0

  # Per-beat override: any beat section below may set its own `prune_level`, which wins over
  # the global one (e.g. transp: {prune_level: 0, ...} while portals: {prune_level: 3, ...}).
  # `keep_all_files: true/false` is still accepted as a DEPRECATED alias of prune_level 0/3.

  # WHEN the 99.5% shaping fed to EPED is (re)frozen (HOW it is extracted is
  # plasma.parameters.separatrix.freeze_995_from). Options:
  #   0    : freeze at initialization and reuse for the whole run (default)
  #   N>0  : re-extract ONCE from beat N's evolved equilibrium (e.g. N=2 -> after the first
  #          real TRANSP beat); useful when the init shaping is a guess (separatrix init)
  #   null : never freeze -- each EPED beat recomputes from its own current equilibrium
  refreeze_995_after_beat: 0

  # ---------------------------------------------------------------------------
  # Each individual beat parameters
  #       beat_type:                     Used to map this beat to what MAESTRO understands
  #       base_module:                   Pointer to another beat to use as base for the to start from (and only provide the modifications)
  #       parameters_prepare:            Parameters that are passed to the prepare() method of the beat class
  #       preprocess_prepare:            [Optional] Function to pre-process rest of namelist to make some decisions on "parameters_prepare"
  #       preprocess_prepare_parameters: [Optional] Pareters that the "preprocess_prepare" function could use
  #       preprocess_run:                [Optional] Function to pre-process rest of namelist to make some decisions on the parameters for run() method
  # ---------------------------------------------------------------------------

  eped:

    beat_type: eped

    base_module: null

    parameters_prepare:

      # Whether to run with full EPED (true) or an EPED-NN surrogate (false; requires
      # the nn_location/norm_location entries below)
      use_full_EPED: true

      # Definition of equilibrium parameters that will based to EPED
      toq_eq_choice: "standard"   # 'standard', 'full_turnbull_miller', 'mxh' - if not provided will default to 'standard'

      # Where to evaluate the Zeff (and fuel dilution) fed to EPED:
      #     'vol_avg':  volume-averaged Zeff of the current state (default)
      #     'pedestal': Zeff interpolated at rho=0.95
      zeff_location: 'vol_avg'

      # (if full EPED) EPED override parameters: dictionary of EPED configuration parameters to override default values in config
      eped_params_override: {}

      # (if full EPED) Retries with a lowered teped exploration floor when no stable
      # solution is found (0: fail immediately); each retry multiplies the floor by the factor
      teped_retries: 2
      teped_retry_lower_factor: 0.7

      # (if full EPED) SLURM time limit (minutes) of each EPED case (needs generous wall-time)
      minutes_slurm: 240

      # (if full EPED) [rule, threshold]: 'G' = flat gamma/omega_A cut; 'W' = EPED1 gamma > C*omega_*i(n)/2 (threshold = calibration C)
      # stability_rule: ['G', 0.03]

      # (if use_full_EPED: false) EPED-NN files and that NN's transformation function, e.g.:
      #   nn_location: $MFEIM_PATH/private_code_mitim/NN_DATA/EPED-NN-SPARC/EPED-NN-MODEL-SPARC.keras
      #   norm_location: $MFEIM_PATH/private_code_mitim/NN_DATA/EPED-NN-SPARC/EPED-NN-NORMALIZATION-SPARC.txt
      #   transform_inputs_fun: import::mitim_tools.surrogate_tools.NNtools.standard_arguments_eped
      # A `corrections_set:` dict (e.g. {Bt: 12.2, R: 1.85}) can force exact NN input values
      nn_location: null
      norm_location: null
      transform_inputs_fun: null

      # Operations after EPED pressure predictions
      ptop_multiplier: 1.0  # Multiplies ptop
      TioverTe: 1.0         # Ti/Te assumption at the pedestal top

    preprocess_prepare: null
    preprocess_prepare_parameters:
      cpus: null  # if null: use as many as available for this MAESTRO job
    preprocess_run: import::mitim_modules.maestro.utils.EPEDbeat.preprocess_run_eped

  eped_initializer:

    beat_type: eped

    base_module: eped

    parameters_prepare: {}

  # Boundary-condition (bc) beat: sets the temperature BC at x_bc by one of several
  # methods, all sharing the same BC-application machinery (core rescaled preserving
  # a/L, analytical edge down to the separatrix, shared 'Te_bc_applied' trans-beat
  # memory and relaxation / response-fit servo).
  # Namelist shape: COMMON knobs sit at the top level of parameters_prepare;
  # method-specific knobs live in a per-method sub-dict named '<method>_parameters'
  # (confinement_parameters, sharpness_parameters; a future betap method would add
  # betap_parameters symmetrically). Both sub-dicts may coexist -- only the selected
  # method's sub-dict is consumed, the other is ignored (its keys are still checked
  # for typos), so base_module inheritance and method switching need no pruning.
  # A method-specific knob placed at the TOP level raises with a pointer to the
  # right sub-dict; unknown keys anywhere raise.
  bc:

    beat_type: bc

    base_module: null

    parameters_prepare:

      # Method that determines the temperature BC at x_bc (full mechanics and rationale
      # documented in BCbeat.py):
      #     'confinement': scan Te_bc until the state matches a target H-factor
      #     'sharpness':   closed-form Te_bc = Tsep/(1 - xi*C) from a prescribed
      #                    edge-to-core gradient ratio xi
      #     'betap':       closed-form Te_bc from a prescribed edge poloidal-beta
      #                    gradient betap' (engineering norm Bpa = mu0*Ip/L_pol)
      # All apply the BC the same way: core a/LT and a/Ln preserved exactly, edge
      # replaced by an analytic shape down to the (kept-fixed) separatrix value.
      method: "confinement"

      # BC location, in the coordinate given by bc_coordinate ('rho', 'roa' or 'psin')
      x_bc: 0.90
      bc_coordinate: "rho"

      # Ti/Te ratio at the BC location
      tite: 1.0

      # Density at the BC change: 'bc' = rescale ne to ne_bc (= neped_20) like the
      # temperatures; 'keep' = leave ne/ni untouched (the neped_20 forwarded to later
      # beats then becomes the actual ne at x_bc)
      density_treatment: "bc"

      # Under-relaxation of Te_bc across bc-beat incarnations (shared 'Te_bc_applied'
      # trans-beat memory; 1.0 = full step; < 1 approaches the target ACROSS beats)
      relaxation: 1.0

      # Servo for the APPLIED Te_bc: 'relaxation' (above) or 'response_fit' (fit the
      # measured Te_bc -> H/xi response of previous cycles and step to the target;
      # fallbacks fit -> secant -> seeded step; see BCbeat.py). response_fit is
      # calibrated for confinement; EXPERIMENTAL for sharpness.
      servo_mode: "relaxation"
      servo_fit_window: 3            # response_fit: recent (non-railed) pairs entering the fit
      servo_alpha_band: [0.10, 2.0]  # response_fit: accepted range of fitted alpha = dlnH/dlnTe_bc
      servo_trust_factor: 1.5        # response_fit: max multiplicative (x or 1/x) Te_bc change per cycle
      servo_seed_gain: 2.5           # response_fit: gain on the single-pair seeded step

      # If True, override x_bc with the previous PORTALS beat's outermost predicted radius
      update_bc_based_on_portals: false

      # -----------------------------------------------------------------------------
      # Method-specific knobs. Consumed only when method matches; the other sub-dict
      # is ignored (keys still typo-checked), so both can stay here.
      # -----------------------------------------------------------------------------

      confinement_parameters:

        # Scaling law whose H-factor is matched: 'H98y2' (IPB98(y,2)) or 'H89p' (ITER89-P)
        confinement_scaling: "H98y2"

        # Target H-factor, matched by scanning Te_bc. Sources stay frozen during the
        # scan (see alpha_power_feedback); self-consistency returns with the next beat.
        confinement: 1.0

        # Edge shape outside x_bc: 'linear' (in psi_n) or 'tanh' (pedestal tanh in r/a).
        # Sharpness is always linear (its xi definition assumes it), hence confinement-only.
        edge_shape: "linear"

        # Recompute qfuse/qfusi analytically at each trial Te_bc so H sees the
        # alpha-heating response (recommended for burning plasmas; negligible cost)
        alpha_power_feedback: false

        # Bounds on Te_bc (keV) for the scan
        Te_bc_bounds: [0.05, 10.0]

        # Isothermal-edge guard: effective floor = max(Te_bc_bounds[0], factor*Tesep),
        # so the edge never goes isothermal/inverted (TRANSP dies on it). A pin at the
        # floor is flagged 'Te_bc_at_floor' in the results. null disables.
        Te_bc_min_Tesep_factor: 1.2

        # Alternative to the guard above (pair with Te_bc_min_Tesep_factor: null): let
        # Te_bc go low and cap the APPLIED Tesep at frac*Te_bc instead (typical 0.8)
        sep_max_frac: null

      sharpness_parameters:

        # Prescribed edge-to-core gradient ratio xi (Te_bc = Tsep/(1 - xi*C)):
        # xi=1 edge gradient equals core gradient; xi>1 sharper (H-mode-like) edge
        sharpness: 1.0

        # Coordinate in which xi is defined: 'psin', 'rho' or 'roa'. Independent of bc_coordinate
        sharpness_coordinate: "psin"

      betap_parameters:

        # Prescribed magnitude (positive) of the edge poloidal-beta gradient:
        #     betap' = [beta_p(x_bc) - beta_p(sep)]/(1 - psin_bc),  beta_p = 2*mu0*p_th/Bpa^2,
        #     Bpa = mu0*Ip/L_pol -- inverted in closed form for Te_bc (thermal pressure only;
        # density is a spectator; edge linear in THERMAL PRESSURE, so d(beta_p)/dpsin is
        # constant across the edge = -betap'). Default 2.0 puts the edge-average
        # alpha_MHD near L-H-relevant/near-marginal gradients (Rogers, Drake & Zeiler,
        # PRL 81 (1998) 4396 barrier threshold; Eich & Manz, NF 61 (2021) 086017 separatrix
        # ballooning limit alpha_c = kappa^1.2*(1+1.5*delta); review: Manz et al., Rev. Mod.
        # Plasma Phys. 9 (2025) 5). NOTE: fixed betap' is NOT fixed alpha_MHD across machines
        # (mapping carries q95^2*(Bpa/B0)^2), and this is an x_bc->sep average, larger locally
        # at the separatrix. See BCbeat.py for the mapping.
        betap_prime: 2.0

    preprocess_prepare: null
    preprocess_prepare_parameters: {}
    preprocess_run: null

  lengyel:

    beat_type: lengyel

    base_module: null

    parameters_prepare:

      # What this beat runs and applies (details in LENGYELbeat.py):
      #     'seeded' (default): detachment-seeded driver -- impurity concentration SOLVED to
      #             detach the divertor; BOTH Tsep and the seed-impurity/Zeff update applied
      #     'clean': non-detached forward conduction -- ONLY Tsep applied; impurities/densities
      #             untouched, no radas needed, PORTALS surrogate data NOT invalidated
      mode: 'seeded'

      # If null, it will use the default namelist at: __mitimroot__ / "templates" / "input.lengyel.controls.yaml"
      # (or input.lengyel_clean.controls.yaml when mode: 'clean')
      lengyel_namelist_location: null

      # Path to radas directory. If null, it will use $RADAS_DIR environement variable (unused when mode: 'clean')
      radas_dir: null

      seed_impurity_species: 
        name: "Ne"
        ratio_fZ_sep_top: 1.0
        edge_profile: "flat"    # Options: "flat", "linear"

      fixed_impurity_species: 'W' # It will try find this element in the ions available in input.gacode, keeping their concentration fixed

      dilution_impurity_species: None
      dilution_impurity_charge: 2
      dilution_impurity_mass: 3.9746
      dilution_impurity_min_concentration: 0

      # Relaxation w in [0, 1] of the Zeff update: realized Zeff = w*imposed + (1-w)*incoming.
      # 1.0 = full update every beat; lower damps beat-to-beat Zeff swings (see LENGYELbeat.py)
      zeff_relaxation_factor: 1.0

      # Floor on the post-Lengyel Zeff (prevents performance/impurity decay cycles). null = no floor
      zeff_floor: Null

      # Verbatim overrides of the Lengyel namelist's `input` block (keys from
      # templates/input.lengyel.controls.yaml), e.g. {parallel_connection_length: '40 m'}
      override_namelist_params: {}


    preprocess_prepare: null
    preprocess_prepare_parameters: {}
    preprocess_run: null

  portals:

    beat_type: portals

    base_module: null

    parameters_prepare:

      # If null, it will use the default namelist at: __mitimroot__ / "templates" / "namelist.portals.yaml"
      portals_namelist_location: null

      # ------------------------------------------------------------------------------------------------
      # PORTALS parameters (only those parameters to change the main PORTALS namelist)
      # ------------------------------------------------------------------------------------------------
      portals_parameters:

        # Same structure as the PORTALS namelist, here indicate only the parameters to change from default "portals_namelist_location"
        solution:
          predicted_roa: [0.35, 0.45, 0.55, 0.65, 0.75, 0.875, 0.9]
          keep_full_model_folder: false
          # Wider exploration than the PORTALS defaults: narrower ranges can clip the
          # flux-matched gradients at high-performance points
          exploration_ranges:
            ymin: 1.0
            ymax: 4.0
            yminymax_atleast: [null, 4]
        transport:
          options:
            tglf:
              run:
                code_settings: "SAT2astra"
                extraOptions:
                  USE_BPER: true
              keep_files: "none" 
              reuse_scan_ball: true # Store previous evaluations and reuse them if they are within the delta of all inputs (to capture combinations)
        target:
          options:
            force_zero_particle_flux: true

        optimization_options:
          convergence_options:
            maximum_iterations: 30
            stopping_criteria_parameters:
              maximum_value: 1.e-5                 # Very strict because we prefer to converge with Ricci criteria
              maximum_value_is_rel: true           # Explicit, because of "use_previous_residual" functionality

          strategy_options:
            AllowedExcursions: [0.25, 0.0]         # Allow to go 25% beyond the gradients lower bound if needed
          acquisition_options:
            optimizers: ["sr"]                     # Use only SR optimizer for acquisition function optimization (faster)

      # gacode_state.correct() operations applied to the seed input.gacode before PORTALS
      initialization_parameters:
        # Reclassify fast ions as thermal (set their Ti to the main thermal Ti, keep density)
        thermalize_fast: true
        # Enforce quasineutrality by adjusting ion densities
        quasineutrality: true
        # zero_source_blocks: source-term aliases to zero in the seed input.gacode handed to
        # PORTALS (an "all-auxiliary" sources picture). Aliases:
        #   'qrad'  -> qbrem, qsync, qline
        #   'qfus'  -> qfuse, qfusi
        #   'qohme' -> qohme
        # IMPORTANT: only persists if the same alias is excluded from target.options.targets_evolve
        # in the overlay above -- otherwise PORTALS overwrites the zeros on iter 1
        # zero_source_blocks: ['qrad', 'qfus', 'qohme']

      # If the width of the pedestal has changed, modify the BC (last in predicted_rX) for PORTALS accordingly
      change_last_radial_call: true

      # Keep the absolute value of the original case as the base to compute relative residuals in subsequent optimizations
      use_previous_residual: true # Should be set to false if an absolute residual convergence metric is defined in optimization_options

      # Later beats to utilize past beats surrogate data if available (e.g. if position has not changed)
      use_previous_surrogate_data: true

      # Use previous exploration ranges to limit the new exploration ranges (good to avoid cases in which a portals beat reports a zero gradient)
      use_previous_ranges: true 

      # If surrogates exist, use them to find the first training point (and limit to only one point)
      try_flux_match_only_for_first_point: true

      # If element is not exactly in radiation database, search for closest one
      enforce_impurity_radiation_existence: true

    preprocess_prepare: import::mitim_modules.maestro.utils.PORTALSbeat.preprocess_prepare_portals
    preprocess_prepare_parameters:
      # By default, run PORTALS with all impurities lumped into one species
      lumpImpurities: true
      # By default, enforce that all species have the same density gradient
      enforce_same_density_gradients: true
    preprocess_run: null

  portals_soft:

    beat_type: portals

    base_module: portals

    parameters_prepare:

      # A soft PORTALS beat means:
      #     No evolving alpha, radiation
      #     More relaxed convergence criteria and optimization strategy
      portals_parameters:
        target:
          options:
            targets_evolve: ["qie"]
        optimization_options:
          convergence_options:
            maximum_iterations: 15
            stopping_criteria_parameters:
              maximum_value: 10.e-3                 # Reducing residual by 1/0.01 = 100x sufficient for a soft PORTALS run
              minimum_inputs_variation: [10, 3, 1.0] # A more relaxed variation for soft PORTALS run
              ricci_value: 0.15                     # A more relaxed Ricci value for soft PORTALS run
          strategy_options:
            AllowedExcursions: [0.0, 0.0]           # In case the soft beat makes things too negative when they shoudn't be


  transp:

    beat_type: transp

    base_module: null

    parameters_prepare:

      # Mahine structures (ICRF antennas, limiters, VV)
      #       If null: define structures as a very simplified setup (e.g. one midplane antenna)
      #       If machine (SPARC, CMOD, ARC, D3D): use actual machine structures harcoded in MITIM (see mitim_tools/experiment_tools/)
      tokamak_structures: null 

      # Equilibrium treatment (full mechanics and caveats documented in TRANSPbeat.py):
      #   A registered machine (CMOD, D3D, NSTX, ITER): TEQ (levgeo=11) solves Grad-Shafranov
      #     every step, warm-started from that machine's stored equilibrium -- pick the one
      #     nearest the target in size/shape and let transition_window morph it
      #   null: PRESCRIBED EQUILIBRIUM (levgeo=8) -- the state's own flux surfaces handed to
      #     TRANSP as data, no GS solve, ANY shape works at t=0; transition_window and
      #     currentheating_window are INERT; the geometry stays FROZEN in time
      machine_initialization: CMOD
      transition_window: 0.1        # Time (s) to transition to MAESTRO plasma from the machine_initialization. If null, no transition performed
      currentheating_window: 0.001  # Time (s) to turn on current diffusion and heating once transitioned
      machine_initialization_match_target: false # If true, ease initialization, match qstar and p0/B0^2 of initialization machine to target plasma

      # Freeze the poloidal field: q pinned to the input QPR ufile for all time (no current
      # diffusion). REQUIRES machine_initialization: null; prepare() raises otherwise
      frozen_field: false

      # Smoothing of the separatrix boundary for TRANSP ufile generation
      mxh_coeffs_smooth_sep: null # if null, it will take n_mxh from "separatrix" section of "plasma"

      # Simulation length
      flattop_window: 2.5
      # Sawteeth on/off: false parks t_sawtooth_on beyond time_end (no crashes at all) --
      # for clean current-diffusion-only studies/benchmarks; pair with extract_at: last
      sawteeth: true
      min_sawtooth_period_ms: 10.0 # Approximate floor on the Porcelli sawtooth period [ms]: sets c_sawtooth(2)=floor/Park-Monticello-period per case so compact plasmas stop crashing every ~ms (which bloats the output CDF); machines whose natural period already exceeds it are unaffected. null disables; if absent, defaults to 1 ms.
      # NOTE: this floor is APPROXIMATE -- c_sawtooth(2) is sized from the INITIAL central Te, but TRANSP applies it with the evolving post-crash central Te, so the realized minimum can differ from the requested value.
      ensure_sawtooths: null  # If not null, ensure at least this many sawtooths in the simulation (if previous TRANSP beat provided this information)
      # If set (e.g. 0.95), rescale the INITIAL q-profile seed so q0 hits this value (q95 held
      # fixed) -- guards over-peaked seeds (deep q0) that crash the Kadomtsev sawtooth model at
      # startup. TRANSP seed only; the state passed downstream is untouched. null = seed untouched
      sanitize_q_input: null

      # Which CDF time slice is extracted to build the next beat's input.gacode:
      #   'saw'    -> the last sawtooth
      #   'saw-N'  -> N coarse slices before the last sawtooth (avoids sampling mid-crash)
      #   'last'   -> the last simulated slice
      #   'last-N' -> N coarse slices before the last slice
      extract_at: saw-1
      # Floor the extraction at this fraction of the flattop window -- guards an
      # only-early-sawtooth plasma from being sampled before heating settles. null disables
      min_extraction_flattop_fraction: 0.5

      # TRANSP namelist parameters
      # Bootstrap current model: hager (historical default; Sauter modified at high
      # collisionality), sauter, nclass or neo (ignored if useBootstrapSmooth is set)
      bootstrap_model: hager
      useNUBEAMforAlphas: True
      # Source-power threshold [W] to engage the fusion-product MC (TRANSP plfhe4; default 100 W).
      # Raise (e.g. 1.0e6) to keep NUBEAM alphas idle until the source is significant (guards a
      # fast-ion runaway during the machine-initialization transition; see NMLtools.py)
      plfhe4: 1.0e+2
      Pich: True
      Pnbi: True
      # NOTE: dtOut_ms (TRANSP sedit/stedit) does NOT reliably reduce the output CDF size --
      # CDF size tracks run length/timestep, not this knob
      dtOut_ms : 10.0
      dtIn_ms : 10.0
      nzones : 60
      nzones_energetic : 20
      nzones_distfun : 10    
      MCparticles : 1.e+4
      toric_ntheta : 64  
      toric_nrho : 128

      # Extract TORIC & NUBEAM additional files for post-analysis
      extractAC: False     
      time_before_end: 0.001

    # Function to modify parameters of the namelist based on the rest of namelist
    preprocess_prepare: import::mitim_modules.maestro.utils.TRANSPbeat.preprocess_prepare_transp
    preprocess_prepare_parameters:
      cpus_toric: null  # if null: use as many as available for this MAESTRO job
      cpus_nubeam: null # if null: use as many as available for this MAESTRO job
    preprocess_run: import::mitim_modules.maestro.utils.TRANSPbeat.preprocess_run_transp

  transp_soft:

    beat_type: transp

    base_module: transp

    # A soft TRANSP beat must be just for current diffusion, no alphas nor ICRF
    parameters_prepare:

        flattop_window: 20.0 # Long flattop to allow for current diffusion

        Pich: False
        Pnbi: False
        useNUBEAMforAlphas: False
      
        dtEquilMax_ms: 100.0
        dtHeating_ms: 100.0
        dtCurrentDiffusion_ms: 100.0
        dtOut_ms: 100.0
        dtIn_ms: 100.0
     
  transp_final:

    beat_type: transp

    base_module: transp

    # A final TRANSP beat must be as a normal TRANSP beat, but extracting AC files and estimating 2 sawtooths
    parameters_prepare:

        ensure_sawtooths: 2

        extractAC: True
        time_before_end: 0.001

  minuet:

    beat_type: minuet

    base_module: null

    # In-process substitute for the transp_soft beat: current diffusion + sawteeth at FIXED
    # kinetic profiles and fixed-boundary equilibrium, via the standalone MINUET package
    # (pip install "mitim-fusion[minuet]"). Runs locally in seconds-to-minutes (no TRANSP
    # machine needed). The kinetics, species and source columns of the incoming state pass
    # through VERBATIM; only the equilibrium blocks and q/johm/jbs are evolved. The saved
    # discharge object (beat_results/run.minuet) can be inspected with mitim_plot_minuet.
    parameters_prepare:

      # Simulation length [s] (the transp_soft flattop_window analog): long enough for the
      # current profile to relax to (near) steady state
      t_end: 20.0

      # true: coupled current diffusion + fixed-boundary Grad-Shafranov, with the equilibrium
      #       metrics refreshed as li drifts (the transp_soft-equivalent behavior).
      # false: pure current diffusion on the frozen input geometry (cheaper; note that only
      #        fixed-period sawteeth are meaningful in this mode -- the Porcelli trigger is inert)
      evolve_equilibrium: true

      # Sawteeth on/off and trigger model. porcelli: self-consistent Porcelli trigger
      # (recommended; needs evolve_equilibrium). fixed_period: imposed clock with
      # sawtooth_period [s]
      sawteeth: true
      sawtooth_model: porcelli
      sawtooth_period: null

      # Post-crash current redistribution: kadomtsev (full reconnection, MINUET default),
      # porcelli (partial reconnection, closest to TRANSP's Porcelli model), partial
      reconnection_model: kadomtsev

      # If not null, extend t_end so at least this many sawtooth crashes are expected,
      # estimated from the previous beat's sawtooth_times (same contract as the transp
      # beat's ensure_sawtooths). Caveat: TRANSP-produced sawtooth_times carry TRANSP's
      # ~0.1 s pre-flattop offset while MINUET's clock starts at 0 (conservative over-estimate)
      ensure_sawtooths: null

      # Physics models (MINUET keeps its physical defaults; TRANSP-parity tweaks live in
      # tests/dev_tests/minuet_vs_transp.py, not here)
      resistivity_model: sauter   # sauter | spitzer
      bootstrap_model: sauter     # sauter | null (purely ohmic)

      # true: command Ip to the frozen engineering current(MA) (the CUR-ufile analog;
      #       recommended -- MINUET distributes the initial mismatch over its edge buffer).
      # false: use the flux content of the incoming state as-is
      Ip_from_frozen: true

      # Resolution / numerics (MINUET defaults; raise gs_ns/gs_ntheta for shaping studies)
      gs_ns: 128        # Grad-Shafranov radial grid
      gs_ntheta: 256    # Grad-Shafranov poloidal grid
      n_cells: 200      # current-diffusion radial cells
      rtol: null        # BDF relative tolerance (null -> MINUET default)
      n_save: 201       # saved time frames (plot granularity of run.minuet)

    preprocess_prepare: null
    preprocess_prepare_parameters: null
    # Injects the gaussian_sources Pe/Pi at beat output (MINUET runs no heating model);
    # no-op for ICRH/NBI (the incoming state's sources pass through verbatim)
    preprocess_run: import::mitim_modules.maestro.utils.MINUETbeat.preprocess_run_minuet

        