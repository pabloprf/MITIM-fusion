# **************************************************************************************************************
# MAESTRO simulation template
# **************************************************************************************************************

# Master random seed for reproducibility, to be sent to all beats that can receive seed
seed: 0

# ------------------------------------------------------------------------------------------------------------
# Plasma
# ------------------------------------------------------------------------------------------------------------

plasma:

  # Initialization of profiles
  profiles_initialization:

    # How to initialize the boundary and q-profile. Options:
    #       geqdsk:     use a GEQDSK file directly
    #       freegs:     use FREEGS to create an equilibrium from boundary parameters
    #       fibe:       use FIBE to create an equilibrium from boundary parameters, requires geqdsk file to specify f and pressure profiles
    #       separatrix: create separatrix from parameters (or RZ file) and guess internal equilibrium or use internal_flux_file
    #       profiles:   use an input.gacode file to initialize both equilibrium and profiles
    initialization_type: freegs      

    # How to initialize the profiles. Options:
    #       eped_initializer: use EPED-based profile initializer (must exist as beat namelist below)
    #       fixed_profiles:   use fixed profiles from a JSON file
    #       fixed_bc:         use user-specified boundary conditions (rho_bc, Te_bc, Ti_bc, ne_bc); can still match BetaN and nu_ne via gradient optimization
    #       null:             use whatever the initialization_type method provides
    creator_type: eped_initializer

    parameters:

      # If creator_type = eped_initializer: Profiles will be initialized such that BetaN is matched as close as possible
      BetaN: 1.0    # Normalized global beta
      nu_ne: 1.3    # Density peaking
      aLTe_to_aLTi_ratio: 1.0  # Keep this ratio during the BetaN optimization
      aLT: null     # [Optional] Use this a/LTi directly (aLTe = aLTe_to_aLTi_ratio * aLTi), skipping the BetaN optimization
      aLn: null     # [Optional] Use this a/Lne directly, skipping the nu_ne optimization
      nresol: 501   # Radial resolution (number of points) of the created profiles

      # If creator_type = fixed_bc: User-specified boundary condition values at x_bc
      #   - x_bc + bc_coordinate, Te_bc, Ti_bc fix the pedestal-top values; Tsep and nsep come from Tesep_eV and ne_ratio_sep_ped above
      #   - BetaN and nu_ne (above) are still used to match target values by adjusting aLT and aLn
      #   - Set BetaN and/or nu_ne to null to skip the corresponding gradient optimization and use aLT/aLn directly
      #
      #   !! Recommend bc_coordinate: 'rho'. rho_tor is the immutable grid coordinate carried
      #      unchanged across beats; 'roa'/'psin' depend on the equilibrium, which is not yet
      #      solved at separatrix initialization, so the BC can be pinned at the wrong rho_tor
      #      and drift once the real equilibrium is solved. The non-rho options are kept
      #      available to accommodate future improvements.
      x_bc: null           # BC location value in bc_coordinate (e.g. pedestal top, typically ~0.95)
      bc_coordinate: "rho" # 'rho' (rho_tor) recommended; 'roa'/'psin' unreliable at init (see note above)
      Te_bc: null          # Te at x_bc (keV)
      Ti_bc: null          # Ti at x_bc (keV); if null, uses Te_bc
      # Note: for fixed_bc, neped_20 (from plasma.parameters above) is used directly as ne_bc

      # If initialization_type = profiles: path to profiles file (input.gacode) to initialize with
      # If creator_type = fixed_profiles:  path to profiles file (json) to initialize with
      profiles_file: null

  parameters:

    # Global plasma parameters (if initialization_type = geqdsk, Bt and Ip must be null, otherwise they will override the geqdsk values)
    Bt: 12.2 
    Ip: 8.7 

    # Profile boundary conditions
    neped_20: 2.5           # Density at "ped" location as defined by EPED
    fGped: null             # [Optional] if not null, use this pedestal Greenwald fraction (overrides neped_20).
                            #            NOTE: needs Ip and a. With initialization_type=geqdsk, any of the two
                            #            left null is read from the geqdsk itself (|CURRENT| in MA; a = separatrix
                            #            half-width), avoiding entries redundant with (or inconsistent with) the
                            #            file; explicit values still take precedence. For all other initialization
                            #            types both must be provided in this namelist.
    ne_ratio_sep_ped: 0.3   # Ratio nsep/nped 
    Tesep_eV: 75.0          # Temperature at separatrix (to potentially change if beat provides physics for this, e.g. Lengyel)

    # Separatrix specification (parameters determined depending on initialization_type)
    separatrix:

      # If initialization_type = freegs, fibe, separatrix: Boundary parameterization (or, alternatively, path to RZ boundary file if "separatrix" mode)
      R: 1.85
      a: 0.57
      delta_sep: 0.57
      kappa_sep: 1.97
      zeta_sep: 0.0  # Can be left as null to use the squareness of the internal_flux_file, if provided

      rz_boundary_file: null # [Optional] file containing the separatrix R,Z points

      # [Optional] If initialization_type = separatrix: path to input.gacode to reproduce internal flux surfaces and other moments
      internal_flux_file: null

      # If initialization_type = geqdsk, freegs, separatrix: Number of MXH coefficients used in TWO places:
      #   1. At INITIALIZATION: the equilibrium->input.gacode conversion (to_profiles) parametrizes every
      #      flux surface with an MXH of this order -- a low order visibly ROUNDS the near-X-point boundary
      #      of the initial state relative to the raw geqdsk (visible in the 'MAESTRO init' tab).
      #   2. To smooth the boundary handed to TRANSP (kinks/loops make TRANSP abort). THIS role is consumed
      #      by the FIRST TRANSP beat only -- the resulting curve is frozen and reused verbatim by every
      #      later TRANSP beat (see boundary_surface_psin below).
      n_mxh: 5

      # Normalized poloidal flux (psi_N) of the flux surface used as the FIXED TRANSP boundary.
      # 1.0 (default) = the separatrix. A value < 1 (e.g. 0.995) backs the boundary off to a surface
      # just inside the separatrix: it is rounder (higher curvature ratio) so it avoids TRANSP's
      # boundary curvature-ratio abort on sharp/near-X-point separatrices, while keeping the true
      # plasma shape (unlike lowering n_mxh).
      #
      # CONSUMED BY THE FIRST TRANSP BEAT ONLY. That beat builds the boundary curve (backoff + n_mxh
      # smoothing), freezes it in parameters_trans_beat, and every later TRANSP beat reuses it
      # VERBATIM -- neither knob is re-applied. This is deliberate: the separatrix is a frozen
      # engineering parameter and TRANSP is fixed-boundary, so the boundary must be identical on
      # every beat. Re-deriving it would compound, because TRANSP's output psi_N=1 surface IS the
      # boundary it was given: 0.995 -> 0.995^2 -> 0.995^3 ... shrinking the plasma every beat (and
      # the MXH round-trip, being a projection rather than idempotent, adds its own smaller drift).
      boundary_surface_psin: 1.0

      # If initialization_type = geqdsk, freegs, fibe: How to extract the 99.5% poloidal flux surface parameters (kappa, delta, zeta)
      # The non-null options below extract these ONCE at initialization (with the chosen parameterization) and FREEZE them:
      # every later EPED beat reuses those same fixed values, even though the real internal flux surfaces drift as the
      # equilibrium evolves (Shafranov shift, beta, ...). This pinning is the purpose of the knob.
      # Options:
      #      analytic:                Use the analytical formulas (not the best fit) to Turnbull-Miller parameters
      #      analytic_interpolation:  Use the analytical formulas (not the best fit) to Turnbull-Miller parameters, but interpolating the coefficients at psiN=0.995
      #      turnbull:                Use Turnbull-Miller parameterization via best-fit methods
      #      mxh:                     Use MXH parameterization via best-fit methods
      #      [miller:                  Use Miller parameterization via best-fit methods] -> NOT AVAILABLE YET
      #      null:                    Do NOT freeze: store nothing in trans_beat, so each EPED beat instead recomputes the
      #                               99.5% shaping from its own current equilibrium -> the values evolve beat-to-beat
      # NOTE: if initialization_type = separatrix, only null vs non-null is honored; the parameterization above is ignored
      #       and the 99.5% surface is always obtained by interpolating the built profiles to psiN=0.995 (no MXH s_three/s_four).
      #       A runtime warning is printed in this case. Since separatrix internal flux surfaces are a parametric guess,
      #       consider `maestro.refreeze_995_after_beat: N` to re-extract the 99.5% shaping from an evolved (e.g. TRANSP) beat.
      # This knob controls only HOW the surface is extracted and whether it is frozen at init; WHEN it is (re)frozen for
      # later EPED beats is controlled by `maestro.refreeze_995_after_beat` (see below).
      freeze_995_from: analytic

      # psi_N at which the "995" shaping (kappa995/delta995/zeta995/s_three995/s_four995) is sampled.
      # The dict keys/labels stay named "995"; only the extraction surface moves. Default 0.995 =
      # current behavior. Raising it toward the separatrix (e.g. 0.998) yields a higher kappa/delta.
      shaping_extraction_psin: 0.995

      # If initialization_type = geqdsk or fibe: path to file
      geqdsk_file: ""

  # Plasma mix
  species:
  
    # Main fuel species
    fuel: ['D', 'T']      # Only ['D', 'T'] or ['D'] allowed for now
      
    # Impurity species
    Zeff: 1.5
    
    mix:
      # Parameters to be used to find lumped low-Z impurity species that matches Zeff (accounting for minority species as well)
      fmain: 0.85
      highZ: W
      fhighZ: 1.5e-5
      CShighZ_estimate: 50    # Estimate of the charge state of high-Z impurity, to compute the lumped low-Z impurity at initialization
      
  # Heating parameters
  heating:

    # Heating model. Options:
    #       ICRH:             Ion Cyclotron Resonance Heating model in TRANSP
    #       NBI:              Neutral Beam Injection model in TRANSP
    #       gaussian_sources: Simple Gaussian heating sources for electrons and ions
    type: ICRH

    # Heating model parameters
    parameters:

      # ~~~~~~~~~~~
      # Parameters ICRF (type = ICRH)
      # ~~~~~~~~~~~

      # Total input power
      P_icrh: 11.0

      # Minority species [Z,A]
      minority: [2, 3]

      # Minority fraction to be added to the mix.
      #     Also honored when type = gaussian_sources: if fmini > 0, TRANSPbeat
      #     forces Pich on and runs TORIC at the full P_icrh specified above,
      #     so TRANSP evolves the H-minority density and pressure
      #     self-consistently. At TRANSP output the auxiliary heating is
      #     replaced with the gaussian_sources Pe/Pi (downstream beats see
      #     only the gaussian heating, plus the now-thermalized minority
      #     density/pressure profiles). Dilution / Zeff via estimateLowZ
      #     therefore matches what's actually in the plasma.
      fmini: 0.05

      # Antenna frequency (MHz)
      #     (only if tokamak_structures is null, otherwise it will be taken from the machine structures definition)
      freq_ICH: null    # If null, estimate on-axis deposition based on field and minority species resonance


      # ~~~~~~~~~~~
      # Parameters NBI (type = NBI)
      # ~~~~~~~~~~~

      # Total input power
      P_nbi: 11.0

      # ~~~~~~~~~~~
      # Parameters for simple Gaussian sources (type = gaussian_sources)
      #     Keep in mind that these implement the profiles of source densities
      #     to provide the desired integrated powers using the current volume
      #     integrals. If the equilibrium changes across beats, the actual Pe/Pi
      #     delivered by the same source parameters can change.
      # ~~~~~~~~~~~
      nu_source: 5.0  # Peaking factor for the source profile
      Pe: 11.0        # Total electron heating power
      Pi: 5.0         # Total ion heating power


# ------------------------------------------------------------------------------------------------------------
# MAESTRO workflow parameters
# ------------------------------------------------------------------------------------------------------------

maestro:

  # Sequence of beats
  beats: ["transp", "eped", "portals", "eped", "portals"]

  # If false, wipe each beat's `run_<name>/` contents after the beat completes.
  # `beat_results/` is preserved — it carries the canonical state for the next beat
  # AND for cross-invocation restart (see beat-specific `_inform_save` for what's
  # persisted: input.gacode + a small sidecar per beat). Plot tabs that depend on
  # run-folder artifacts degrade gracefully (caught by MAESTROmain._plot_beats's
  # try/except FileNotFoundError, never fatal):
  #   - EPED "orig" pre-EPED profile trace is skipped (`run_eped/input.gacode` is gone).
  #   - TRANSP CDF detail tab is skipped: the multi-GB CDF is no longer copied to
  #     beat_results/; only `transp_results.npy` (sawtooth_times + impurity_order)
  #     travels forward. Sufficient for chain inheritance, not for full CDF plotting.
  # PORTALS plot tabs are unaffected (their inputs are persisted in beat_results/Outputs/).
  keep_all_files: true

  # When to freeze the 99.5% shaping (kappa995/delta995/zeta995) that is fed to every EPED beat.
  # This is orthogonal to `plasma.parameters.separatrix.freeze_995_from` (which sets HOW the surface
  # is extracted); this knob sets WHEN it is fixed:
  #   0    : freeze at initialization and reuse for the whole run (default; the old behavior).
  #   N>0  : re-extract ONCE from beat N's evolved equilibrium (e.g. N=2 -> after the first real TRANSP
  #          beat), overwrite the frozen values, and reuse those for every later EPED beat. Use this to
  #          feed EPED a real equilibrium instead of the initialization guess (relevant for separatrix
  #          init, whose internal flux surfaces are a parametric guess).
  #   null : never freeze -- each EPED beat recomputes the 99.5% shaping from its own current
  #          equilibrium, so the values evolve beat-to-beat.
  refreeze_995_after_beat: 0

  # ---------------------------------------------------------------------------
  # Each individual beat parameters
  #       beat_type:                     Used to map this beat to what MAESTRO understands
  #       base_module:                   Pointer to another beat to use as base for the to start from (and only provide the modifications)
  #       parameters_prepare:            Parameters that are passed to the prepare() method of the beat class
  #       preprocess_prepare:            [Optional] Function to pre-process rest of namelist to make some decisions on "parameters_prepare"
  #       preprocess_prepare_parameters: [Optional] Pareters that the "preprocess_prepare" function could use
  #       preprocess_run:                [Optional] Function to pre-process rest of namelist to make some decisions on the parameters for run() method
  # ---------------------------------------------------------------------------

  eped:

    beat_type: eped

    base_module: null

    parameters_prepare:

      # Whether to run with full EPED (true) or an EPED-NN surrogate (false; requires
      # the nn_location/norm_location entries below)
      use_full_EPED: true

      # Definition of equilibrium parameters that will based to EPED
      toq_eq_choice: "standard"   # 'standard', 'full_turnbull_miller', 'mxh' - if not provided will default to 'standard'

      # (if full EPED) EPED override parameters: dictionary of EPED configuration parameters to override default values in config
      eped_params_override: {}

      # (if full EPED) Retries when EPED finds no stable solution within the explored
      # pedestal-temperature window: each retry lowers the floor of TEPED_BOUND relative
      # to the original one (floor_n = floor_0 * teped_retry_lower_factor^n) and re-runs.
      # Set teped_retries: 0 to fail immediately instead (pre-retry behavior).
      teped_retries: 2
      teped_retry_lower_factor: 0.7

      # (if full EPED) SLURM time limit (minutes) of each EPED case. Full EPED needs
      # generous wall-time (the width x teped stability sweep); pair it with enough
      # cores per case (the `cpus` knob in preprocess_prepare_parameters below).
      minutes_slurm: 240

      # (if use_full_EPED: false) Location of the EPED-NN files and the transformation
      # function of that specific NN, e.g.:
      #   nn_location: $MFEIM_PATH/private_code_mitim/NN_DATA/EPED-NN-SPARC/EPED-NN-MODEL-SPARC.keras
      #   norm_location: $MFEIM_PATH/private_code_mitim/NN_DATA/EPED-NN-SPARC/EPED-NN-NORMALIZATION-SPARC.txt
      #   transform_inputs_fun: import::mitim_tools.surrogate_tools.NNtools.standard_arguments_eped
      # A `corrections_set:` dictionary (e.g. {Bt: 12.2, R: 1.85, a: 0.57}) can force
      # exact input values, to avoid NN issues with non-trained parameters.
      nn_location: null
      norm_location: null
      transform_inputs_fun: null

      # Operations after EPED pressure predictions
      ptop_multiplier: 1.0  # Multiplies ptop
      TioverTe: 1.0         # Ti/Te assumption at the pedestal top

    preprocess_prepare: null
    preprocess_prepare_parameters:
      cpus: null  # if null: use as many as available for this MAESTRO job
    preprocess_run: import::mitim_modules.maestro.utils.EPEDbeat.preprocess_run_eped

  eped_initializer:

    beat_type: eped

    base_module: eped

    parameters_prepare: {}

  sharpness:

    beat_type: sharpness

    base_module: null

    parameters_prepare:

      # Location of the boundary condition in the coordinate given by bc_coordinate
      x_bc: 0.90

      # Coordinate system for x_bc: 'rho' (rho_tor, default), 'roa' (r/a), 'psin' (normalized poloidal flux)
      bc_coordinate: "rho"

      # Prescribed sharpness parameter xi (ratio of edge to core temperature gradient)
      # xi=1 means edge gradient matches core gradient; xi>1 means sharper (more H-mode-like) edge
      # How the BC is applied: core (rho < rho_bc) preserves a/LT and a/Ln exactly (the
      # profiles are multiplied by T_bc,new/T_bc,old; absolute gradients dT/dr scale with
      # the BC ratio); edge is replaced by a straight line in psi_n down to the
      # (kept-fixed) separatrix value. The analytical edge starts ONE grid point past
      # the BC, so the a/L gradients that PORTALS reads at its last control point are
      # preserved exactly (the slope kink sits outside the PORTALS prediction grid).
      sharpness: 1.0

      # Coordinate system in which the sharpness parameter xi (the gradient ratio) is defined.
      # Independent of bc_coordinate. Options: 'psin' (default), 'rho' (rho_tor), 'roa' (r/a)
      sharpness_coordinate: "psin"

      # Ti/Te ratio at the boundary condition location (default 1.0)
      tite: 1.0

      # What to do with the density profiles at the BC change. Options:
      #     'bc':   core ne rescaled to ne_bc (= neped_20) preserving a/Lne, edge replaced
      #             with the same shape as the temperatures, ion densities rescaled to
      #             keep ni/ne ratios (default, original behavior)
      #     'keep': ne and all ion densities left untouched; only Te/Ti are modified.
      #             The neped_20 passed to subsequent beats is then the actual ne at
      #             rho_bc read from the profiles (any inherited neped_20 is ignored).
      density_treatment: "bc"

      # If True, override x_bc with the outermost radial location used by the previous
      # PORTALS beat (predicted_rho[-1] or predicted_roa[-1] from trans-beat parameters).
      # bc_coordinate is updated automatically; sharpness_coordinate is never changed.
      update_bc_based_on_portals: false

    preprocess_prepare: null
    preprocess_prepare_parameters: {}
    preprocess_run: null

  confinement:

    beat_type: confinement

    base_module: null

    parameters_prepare:

      # Location of the boundary condition in the coordinate given by bc_coordinate
      x_bc: 0.90

      # Coordinate system for x_bc: 'rho' (rho_tor, default), 'roa' (r/a), 'psin' (normalized poloidal flux)
      bc_coordinate: "rho"

      # Confinement scaling law whose H-factor is matched. Options:
      #     'H98y2': IPB98(y,2) thermal energy confinement scaling (default)
      #     'H89p':  ITER89-P L-mode scaling
      confinement_scaling: "H98y2"

      # Target H-factor value. Te_bc cannot be inverted analytically from the H-factor
      # (it depends on the volume-integrated thermal stored energy of the full modified
      # profiles), so it is found by Nelder-Mead minimization of ((H - target)/target)^2,
      # applying the boundary condition at each trial Te_bc with the same profile
      # machinery as the sharpness beat.
      # How the BC is applied (same machinery as the sharpness beat):
      #   - Core (rho < rho_bc): the normalized logarithmic gradients a/LT and a/Ln are
      #     PRESERVED exactly (the profiles are multiplied by T_bc,new/T_bc,old). The
      #     absolute gradients dT/dr are NOT preserved -- they scale with that same
      #     ratio. a/LT is the gradient-driven-transport quantity, so PORTALS surrogate
      #     data remains reusable across the BC change.
      #   - Edge: profiles replaced by the shape selected with edge_shape below, down to
      #     the (kept-fixed) separatrix value. The analytical edge starts ONE grid point
      #     past the BC, so the a/L gradients that PORTALS reads at its last control
      #     point are preserved exactly (the slope kink sits outside the PORTALS
      #     prediction grid).
      #   - Density: per density_treatment below (rescaled to ne_bc, or left untouched).
      # NOTE: by default, the auxiliary, fusion and radiation source profiles stored in
      # input.gacode are NOT recomputed during the Te_bc scan (total heating power stays
      # frozen); the H-factor responds through the thermal stored energy. Source
      # self-consistency is recovered by the subsequent PORTALS/TRANSP beat in the chain.
      # See alpha_power_feedback below to lift this assumption for the fusion sources.
      confinement: 1.0

      # Ti/Te ratio at the boundary condition location (default 1.0)
      tite: 1.0

      # Shape of the Te/Ti/ne profiles in the edge region (rho > rho_bc). Options:
      #     'linear': straight line in psi_n from the BC value to the separatrix value
      #     'tanh':   pedestal tanh in r/a, the same functional form the eped_initializer
      #               uses (FunctionalForms.pedestal_tanh), also anchored at the BC and
      #               separatrix values
      edge_shape: "linear"

      # If true, recompute the fusion source profiles (qfuse/qfusi) from the trial
      # profiles at every minimization step, using the analytic powerstate targets
      # (transport-free; same model as PORTALS analytical targets). The H-factor then
      # accounts for the alpha-heating response to the BC change: raising Te_bc raises
      # Pfus -> raises qHeat -> H grows slower than with frozen sources (H ~ W*P^-0.31
      # for H98y2), so in burning plasmas freezing the sources underestimates the Te_bc
      # needed for a given target. The recomputed qfus is also written into the beat
      # output state (and the baseline H is recomputed with the same model for a
      # consistent comparison). Radiation/exchange sources are left untouched: they do
      # not enter the H-factor and are evolved by the next PORTALS beat anyway.
      # No-op for non-DT plasmas (analytic model returns zero fusion without thermal D+T).
      # Cost: negligible (analytic, no transport calls).
      alpha_power_feedback: false

      # What to do with the density profiles at the BC change. Options:
      #     'bc':   core ne rescaled to ne_bc (= neped_20) preserving a/Lne, edge replaced
      #             with the same shape as the temperatures, ion densities rescaled to
      #             keep ni/ne ratios (default, original behavior)
      #     'keep': ne and all ion densities left untouched; only Te/Ti are modified, so
      #             the H-factor responds to the BC purely through the temperatures (note
      #             the tau scalings carry a density dependence, e.g. <ne>^0.41 in H98y2,
      #             so 'bc' lets density move H independently of Te_bc). The neped_20
      #             passed to subsequent beats is then the actual ne at rho_bc read from
      #             the profiles (any inherited neped_20 is ignored).
      density_treatment: "bc"

      # Bounds on Te_bc (keV) for the minimization
      Te_bc_bounds: [0.05, 10.0]

      # If True, override x_bc with the outermost radial location used by the previous
      # PORTALS beat (predicted_rho[-1] or predicted_roa[-1] from trans-beat parameters).
      # bc_coordinate is updated automatically.
      update_bc_based_on_portals: false

    preprocess_prepare: null
    preprocess_prepare_parameters: {}
    preprocess_run: null

  lengyel:

    beat_type: lengyel

    base_module: null

    parameters_prepare:

      # If null, it will use the default namelist at: __mitimroot__ / "templates" / "input.lengyel.controls.yaml"
      lengyel_namelist_location: null

      # Path to radas directory. If null, it will use $RADAS_DIR environement variable
      radas_dir: null

      seed_impurity_species: 
        name: "Ne"
        ratio_fZ_sep_top: 1.0
        edge_profile: "flat"    # Options: "flat", "linear"

      fixed_impurity_species: 'W' # It will try find this element in the ions available in input.gacode, keeping their concentration fixed

      # Relaxation factor w in [0, 1] for the Zeff update. The Zeff profile actually realized is
      # w * <Zeff this Lengyel beat would fully impose> + (1-w) * <Zeff of the profiles input into this
      # beat>. w = 1.0 (default) applies the full update every time (old behavior). Lower values slow down
      # how fast Zeff/impurity content changes beat-to-beat -- useful since a higher core Zeff (e.g. 2.0-2.3)
      # than strictly required for divertor protection can be beneficial, and letting it swing every beat can
      # make the workflow oscillate/degrade instead of converging. The "profile input into this beat" is
      # whatever input.gacode this beat received from the immediately preceding beat (PORTALS, EPED, TRANSP,
      # or a previous Lengyel beat), so this applies identically on the first Lengyel beat of a sequence as
      # on every subsequent one.
      zeff_relaxation_factor: 1.0 

      # Zeff floor will enforce that the Zeff after the Lengyel beat has to stay about this value. Since impurities can help improvement performance, 
      # this prevents cycles of decreasing performance, decreasing the amount of impurities, etc. Null will not enforce any floor. 
      zeff_floor: Null 

      # Overrides applied to the Lengyel namelist's `input` block (see templates/input.lengyel.controls.yaml).
      # Any key from that file can be set here verbatim and it will replace the default (or input.gacode-derived)
      # value for this beat, e.g. override_namelist_params: {parallel_connection_length: '40 m', target_angle_of_incidence: '5 degree'}
      override_namelist_params: {}


    preprocess_prepare: null
    preprocess_prepare_parameters: {}
    preprocess_run: null

  portals:

    beat_type: portals

    base_module: null

    parameters_prepare:

      # If null, it will use the default namelist at: __mitimroot__ / "templates" / "namelist.portals.yaml"
      portals_namelist_location: null

      # ------------------------------------------------------------------------------------------------
      # PORTALS parameters (only those parameters to change the main PORTALS namelist)
      # ------------------------------------------------------------------------------------------------
      portals_parameters:

        # Same structure as the PORTALS namelist, here indicate only the parameters to change from default "portals_namelist_location"
        solution:
          predicted_roa: [0.35, 0.45, 0.55, 0.65, 0.75, 0.875, 0.9]
          keep_full_model_folder: false
          # Wider exploration than the PORTALS defaults (ymax 3.0, yminymax_atleast [0,2]):
          # validated across the ARC V3A / V4C case7 MAESTRO scans (2026), where the narrower
          # defaults could clip the flux-matched gradients at high-performance points.
          exploration_ranges:
            ymin: 1.0
            ymax: 4.0
            yminymax_atleast: [null, 4]
        transport:
          options:
            tglf:
              run:
                code_settings: "SAT2astra"
                extraOptions:
                  USE_BPER: true
              keep_files: "none" 
              reuse_scan_ball: true # Store previous evaluations and reuse them if they are within the delta of all inputs (to capture combinations)
        target:
          options:
            force_zero_particle_flux: true

        optimization_options:
          convergence_options:
            maximum_iterations: 30
            stopping_criteria_parameters:
              maximum_value: 1.e-5                 # Very strict because we prefer to converge with Ricci criteria
              maximum_value_is_rel: true           # Explicit, because of "use_previous_residual" functionality

          strategy_options:
            AllowedExcursions: [0.25, 0.0]         # Allow to go 25% beyond the gradients lower bound if needed
          acquisition_options:
            optimizers: ["sr"]                     # Use only SR optimizer for acquisition function optimization (faster)

      # gacode_state.correct() operations applied to the seed input.gacode before PORTALS
      initialization_parameters:
        # Reclassify fast ions as thermal (set their Ti to the main thermal Ti, keep density)
        thermalize_fast: true
        # Enforce quasineutrality by adjusting ion densities
        quasineutrality: true
        # zero_source_blocks: list of source-term aliases to zero in the seed
        # input.gacode handed to PORTALS. Useful when the upstream beat (e.g.
        # TRANSP) populated radiation/alpha/ohmic and you want PORTALS to see
        # an "all-auxiliary" sources picture (the only heating left is what's
        # in qrfe/qrfi/qbeame/qbeami/qione).
        # Recognized aliases:
        #   'qrad'  -> qbrem(MW/m^3), qsync(MW/m^3), qline(MW/m^3)
        #   'qfus'  -> qfuse(MW/m^3), qfusi(MW/m^3)
        #   'qohme' -> qohme(MW/m^3)
        # IMPORTANT: zeroing here only persists in the PORTALS output if PORTALS
        # is configured NOT to evolve the corresponding channel — exclude the
        # same alias from `target.options.targets_evolve` in the portals_parameters
        # overlay above. Otherwise PORTALS overwrites the zeros on iter 1.
        # zero_source_blocks: ['qrad', 'qfus', 'qohme']

      # If the width of the pedestal has changed, modify the BC (last in predicted_rX) for PORTALS accordingly
      change_last_radial_call: true

      # Keep the absolute value of the original case as the base to compute relative residuals in subsequent optimizations
      use_previous_residual: true # Should be set to false if an absolute residual convergence metric is defined in optimization_options

      # Later beats to utilize past beats surrogate data if available (e.g. if position has not changed)
      use_previous_surrogate_data: true

      # Use previous exploration ranges to limit the new exploration ranges (good to avoid cases in which a portals beat reports a zero gradient)
      use_previous_ranges: true 

      # If surrogates exist, use them to find the first training point (and limit to only one point)
      try_flux_match_only_for_first_point: true

      # If element is not exactly in radiation database, search for closest one
      enforce_impurity_radiation_existence: true

    preprocess_prepare: import::mitim_modules.maestro.utils.PORTALSbeat.preprocess_prepare_portals
    preprocess_prepare_parameters:
      # By default, run PORTALS with all impurities lumped into one species
      lumpImpurities: true
      # By default, enforce that all species have the same density gradient
      enforce_same_density_gradients: true
    preprocess_run: null

  portals_soft:

    beat_type: portals

    base_module: portals

    parameters_prepare:

      # A soft PORTALS beat means:
      #     No evolving alpha, radiation
      #     More relaxed convergence criteria and optimization strategy
      portals_parameters:
        target:
          options:
            targets_evolve: ["qie"]
        optimization_options:
          convergence_options:
            maximum_iterations: 15
            stopping_criteria_parameters:
              maximum_value: 10.e-3                 # Reducing residual by 1/0.01 = 100x sufficient for a soft PORTALS run
              minimum_inputs_variation: [10, 3, 1.0] # A more relaxed variation for soft PORTALS run
              ricci_value: 0.15                     # A more relaxed Ricci value for soft PORTALS run
          strategy_options:
            AllowedExcursions: [0.0, 0.0]           # In case the soft beat makes things too negative when they shoudn't be


  transp:

    beat_type: transp

    base_module: null

    parameters_prepare:

      # Mahine structures (ICRF antennas, limiters, VV)
      #       If null: define structures as a very simplified setup (e.g. one midplane antenna)
      #       If machine (SPARC, CMOD, ARC, D3D): use actual machine structures harcoded in MITIM (see mitim_tools/experiment_tools/)
      tokamak_structures: null 

      # Machine to initialize TRANSP equilibrium, and time (s) to transition to MAESTRO plasma
      machine_initialization: CMOD  # Machine to initialize TRANSP equilibrium
      transition_window: 0.1        # Time (s) to transition to MAESTRO plasma from the machine_initialization. If null, no transition performed
      currentheating_window: 0.001  # Time (s) to turn on current diffusion and heating once transitioned
      machine_initialization_match_target: false # If true, ease initialization, match qstar and p0/B0^2 of initialization machine to target plasma

      # Smoothing of the separatrix boundary for TRANSP ufile generation
      mxh_coeffs_smooth_sep: null # if null, it will take n_mxh from "separatrix" section of "plasma"

      # Simulation length
      flattop_window: 2.5
      min_sawtooth_period_ms: 10.0 # Approximate floor on the Porcelli sawtooth period [ms]: sets c_sawtooth(2)=floor/Park-Monticello-period per case so compact plasmas stop crashing every ~ms (which bloats the output CDF); machines whose natural period already exceeds it are unaffected. null disables; if absent, defaults to 1 ms.
      # NOTE: this floor is APPROXIMATE -- c_sawtooth(2) is sized from the INITIAL central Te, but TRANSP applies it with the evolving post-crash central Te, so the realized minimum can differ from the requested value.
      ensure_sawtooths: null  # If not null, ensure at least this many sawtooths in the simulation (if previous TRANSP beat provided this information)
      # Sanitize a pathological over-peaked q seed so TRANSP starts cleanly. Some equilibria (e.g. certain
      # FREEGS geqdsks) carry a very low on-axis q0 -> the q=1 surface sits far toward the boundary, and the
      # Kadomtsev sawtooth model fails on its first crash ("q=1 too close to boundary") and hard-exits before
      # current diffusion moves anything. Since current diffusion relaxes q to self-consistency over the whole
      # flattop, only the SEED needs to start benign. If set (e.g. 0.95), rescale the initial q-profile so q0
      # hits this value, anchored on q95 (q at psiN=0.95 held fixed) so shape/edge are preserved. Applied to
      # the TRANSP seed only (state passed downstream is untouched). null (default) leaves the seed q as-is.
      sanitize_q_input: null

      # Which CDF time slice is extracted to build the next beat's input.gacode:
      #   'saw'    -> the last sawtooth (CDFtools ind_saw)
      #   'saw-N'  -> N coarse slices before the last sawtooth (the coarse MAESTRO time grid can
      #              otherwise land mid-crash; a small step-back avoids sawtoothing profiles)
      #   'last'   -> the last simulated slice
      #   'last-N' -> N coarse slices before the last slice
      extract_at: saw-1  # historical default
      # Floor on how early we sample: if the extract_at slice lands before this fraction of the
      # flattop window (measured from the start of flattop, time_diffusion -> time_end), extract
      # at the floor instead. Guards against a plasma whose ONLY sawtooth fires early (then never
      # again) being sampled before heating / current diffusion have settled. null disables.
      min_extraction_flattop_fraction: 0.5

      # TRANSP namelist parameters
      useNUBEAMforAlphas: True
      Pich: True
      Pnbi: True
      # NOTE: dtOut_ms -> TRANSP sedit/stedit, but in practice it does NOT reliably reduce the
      # output CDF size: observed transp_soft CDFs are written at ~the internal timestep (tens of
      # thousands of slices over a ~20 s run) regardless. CDF size tracks run length/timestep, not
      # this knob (mechanism not fully root-caused as of 2026-06).
      dtOut_ms : 10.0
      dtIn_ms : 10.0
      nzones : 60
      nzones_energetic : 20
      nzones_distfun : 10    
      MCparticles : 1.e+4
      toric_ntheta : 64  
      toric_nrho : 128

      # Extract TORIC & NUBEAM additional files for post-analysis
      extractAC: False     
      time_before_end: 0.001

    # Function to modify parameters of the namelist based on the rest of namelist
    preprocess_prepare: import::mitim_modules.maestro.utils.TRANSPbeat.preprocess_prepare_transp
    preprocess_prepare_parameters:
      cpus_toric: null  # if null: use as many as available for this MAESTRO job
      cpus_nubeam: null # if null: use as many as available for this MAESTRO job
    preprocess_run: import::mitim_modules.maestro.utils.TRANSPbeat.preprocess_run_transp

  transp_soft:

    beat_type: transp

    base_module: transp

    # A soft TRANSP beat must be just for current diffusion, no alphas nor ICRF
    parameters_prepare:

        flattop_window: 20.0 # Long flattop to allow for current diffusion

        Pich: False
        Pnbi: False
        useNUBEAMforAlphas: False
      
        dtEquilMax_ms: 100.0
        dtHeating_ms: 100.0
        dtCurrentDiffusion_ms: 100.0
        dtOut_ms: 100.0
        dtIn_ms: 100.0
     
  transp_final:

    beat_type: transp

    base_module: transp

    # A final TRANSP beat must be as a normal TRANSP beat, but extracting AC files and estimating 2 sawtooths
    parameters_prepare:

        ensure_sawtooths: 2

        extractAC: True
        time_before_end: 0.001

        