# **************************************************************************************************************
# MAESTRO simulation template
# **************************************************************************************************************

# Master random seed for reproducibility, to be sent to all beats that can receive seed
seed: 0

# ------------------------------------------------------------------------------------------------------------
# Plasma
# ------------------------------------------------------------------------------------------------------------

plasma:

  # Initialization of profiles
  profiles_initialization:

    # How to initialize the boundary and q-profile. Options:
    #       geqdsk:     use a GEQDSK file directly
    #       freegs:     use FREEGS to create an equilibrium from boundary parameters
    #       fibe:       use FIBE to create an equilibrium from boundary parameters, requires geqdsk file to specify f and pressure profiles
    #       separatrix: create separatrix from parameters (or RZ file) and guess internal equilibrium or use internal_flux_file
    #       profiles:   use an input.gacode file to initialize both equilibrium and profiles
    initialization_type: freegs      

    # How to initialize the profiles. Options:
    #       eped_initializer: use EPED-based profile initializer (must exist as beat namelist below)
    #       fixed_profiles:   use fixed profiles from a JSON file
    #       null:             use whatever the initialization_type method provides
    creator_type: eped_initializer

    parameters:

      # If creator_type = eped_initializer: Profiles will be initialized such that BetaN is matched as close as possible
      BetaN: 1.0    # Normalized global beta
      nu_ne: 1.3    # Density peaking
      aLTe_to_aLTi_ratio: 1.0  # Keep this ratio during the BetaN optimization

      # If initialization_type = profiles: path to profiles file (input.gacode) to initialize with
      # If creator_type = fixed_profiles:  path to profiles file (json) to initialize with
      profiles_file: null 

  parameters:

    # Global plasma parameters (if initialization_type = geqdsk, Bt and Ip must be null, otherwise they will override the geqdsk values)
    Bt: 12.2 
    Ip: 8.7 

    # Profile boundary conditions
    neped_20: 2.5           # Density at "ped" location as defined by EPED
    ne_ratio_sep_ped: 0.3   # Ratio nsep/nped 
    Tesep_eV: 75.0          # Temperature at separatrix (to potentially change if beat provides physics for this, e.g. Lengyel)

    # Separatrix specification (parameters determined depending on initialization_type)
    separatrix:

      # If initialization_type = freegs, fibe, separatrix: Boundary parameterization (or, alternatively, path to RZ boundary file if "separatrix" mode)
      R: 1.85
      a: 0.57
      delta_sep: 0.57
      kappa_sep: 1.97
      zeta_sep: 0.0  # Can be left as null to use the squareness of the internal_flux_file, if provided

      rz_boundary_file: null # [Optional] file containing the separatrix R,Z points

      # [Optional] If initialization_type = separatrix: path to input.gacode to reproduce internal flux surfaces and other moments
      internal_flux_file: null

      # If initialization_type = geqdsk, freegs, separatrix: Number of MXH coefficients to parametrize the boundary, once created
      n_mxh: 5

      # If initialization_type = geqdsk, freegs, fibe: How to extract the 99.5% poloidal flux surface parameters (kappa, delta, zeta)
      freeze_995_from: geo    # Options: geo, turnbull, null (if null: no trans_beat parameters will be set)

      # If initialization_type = geqdsk or fibe: path to file
      geqdsk_file: ""

  # Plasma mix
  species:
  
    # Main fuel species
    fuel: ['D', 'T']      # Only ['D', 'T'] or ['D'] allowed for now
      
    # Impurity species
    Zeff: 1.5
    
    mix:
      # Parameters to be used to find lumped low-Z impurity species that matches Zeff (accounting for minority species as well)
      fmain: 0.85
      highZ: W
      fhighZ: 1.5e-5
      CShighZ_estimate: 50    # Estimate of the charge state of high-Z impurity, to compute the lumped low-Z impurity at initialization
      
  # Heating parameters
  heating:

    # Heating model. Options:
    #       ICRH:             Ion Cyclotron Resonance Heating model in TRANSP
    #       gaussian_sources: Simple Gaussian heating sources for electrons and ions
    type: ICRH

    # Heating model parameters
    parameters:

      # If type = ICRH: Total input power
      P_icrh: 11.0

      # If type = ICRH: Minority species [Z,A]
      minority: [2, 3]

      # If type = ICRH: Minority fraction to be added to the mix
      fmini: 0.05

      # If type = ICRH: Antenna frequency (in MHz)
      freq_ICH: null    # If null, estimate on-axis deposition based on field and minority species resonance

      # If type = gaussian_sources: Gaussian source parameters
      nu_source: 5.0  # Peaking factor for the source profile
      Pe: 11.0        # Total electron heating power
      Pi: 5.0         # Total ion heating power

# ------------------------------------------------------------------------------------------------------------
# MAESTRO workflow parameters
# ------------------------------------------------------------------------------------------------------------

maestro:

  # Sequence of beats
  beats: ["transp_soft", "eped", "portals", "eped", "portals"]

  # Remove intermediate files to avoid heavy MAESTRO simulation folders
  keep_all_files: true

  # ---------------------------------------------------------------------------
  # Each individual beat parameters
  #       beat_type:                     Used to map this beat to what MAESTRO understands
  #       base_module:                   Pointer to another beat to use as base for the to start from (and only provide the modifications)
  #       parameters_prepare:            Parameters that are passed to the prepare() method of the beat class
  #       preprocess_prepare:            [Optional] Function to pre-process rest of namelist to make some decisions on "parameters_prepare"
  #       preprocess_prepare_parameters: [Optional] Pareters that the "preprocess_prepare" function could use
  #       preprocess_run:                [Optional] Function to pre-process rest of namelist to make some decisions on the parameters for run() method
  # ---------------------------------------------------------------------------

  eped:

    beat_type: eped

    base_module: null

    parameters_prepare:

      # Whether to run with full EPED or EPED-NN
      use_full_EPED: false
      toq_eq_choice: "standard"   # 'standard', 'full_turnbull_miller', 'mxh' - if not provided will default to 'standard'

      # (if full EPED) EPED override parameters: dictionary of EPED configuration parameters to override default values in config
      eped_params_override: {}

      # Location of EPED-NN files and transformation function of this specific NN
      nn_location: $MFEIM_PATH/private_code_mitim/NN_DATA/EPED-NN-SPARC/EPED-NN-MODEL-SPARC.keras
      norm_location: $MFEIM_PATH/private_code_mitim/NN_DATA/EPED-NN-SPARC/EPED-NN-NORMALIZATION-SPARC.txt
      transform_inputs_fun: import::mitim_tools.surrogate_tools.NNtools.standard_arguments_eped

      # Corrections set for EPED-NN indicate the values that I force them to be exact, to avoid NN issues with non-trained parameters
      corrections_set:
        Bt: 12.2
        R: 1.85
        a: 0.57

      # Operations after EPED pressure predictions
      ptop_multiplier: 1.0  # Multiplies ptop
      TioverTe: 1.0         # Ti/Te assumption at the pedestal top

    preprocess_prepare: null
    preprocess_prepare_parameters:
      cpus: null  # if null: use as many as available for this MAESTRO job
    preprocess_run: import::mitim_modules.maestro.utils.EPEDbeat.preprocess_run_eped

  eped_initializer:

    beat_type: eped
   
    base_module: eped

    parameters_prepare: {}

  lengyel:

    beat_type: lengyel

    base_module: null

    parameters_prepare:

      # If null, it will use the default namelist at: __mitimroot__ / "templates" / "input.lengyel.controls.yaml"
      lengyel_namelist_location: null

      # Path to radas directory. If null, it will use $RADAS_DIR environement variable
      radas_dir: null

      seed_impurity_species: 
        name: "Ne"
        ratio_nZ_sep_top: 1.0

      fixed_impurity_species: 'W' # It will try find this element in the ions available in input.gacode, keeping their concentration fixed

    preprocess_prepare: null
    preprocess_prepare_parameters: {}
    preprocess_run: null

  portals:

    beat_type: portals

    base_module: null

    parameters_prepare:

      # If null, it will use the default namelist at: __mitimroot__ / "templates" / "namelist.portals.yaml"
      portals_namelist_location: null

      # ------------------------------------------------------------------------------------------------
      # PORTALS parameters (only those parameters to change the main PORTALS namelist)
      # ------------------------------------------------------------------------------------------------
      portals_parameters:

        # Same structure as the PORTALS namelist, here indicate only the parameters to change from default "portals_namelist_location"
        solution:
          predicted_roa: [0.35, 0.45, 0.55, 0.65, 0.75, 0.875, 0.9]
          keep_full_model_folder: false
        transport:
          options:
            tglf:
              run:
                code_settings: "SAT2astra"
                extraOptions:
                  USE_BPER: true
              keep_files: "none" 
              reuse_scan_ball: true # Store previous evaluations and reuse them if they are within the delta of all inputs (to capture combinations)
        target:
          options:
            force_zero_particle_flux: true

        optimization_options:
          convergence_options:
            maximum_iterations: 30
            stopping_criteria_parameters:
              maximum_value: 5.e-3                 # Explicit, because of "use_previous_residual" functionality
              maximum_value_is_rel: true           # Explicit, because of "use_previous_residual" functionality

          strategy_options:
            AllowedExcursions: [0.25, 0.0]         # Allow to go 25% beyond the gradients lower bound if needed
          acquisition_options:
            optimizers: ["sr"]                     # Use only SR optimizer for acquisition function optimization (faster)

      # Operations to do to mitim_state before passing it to PORTALS
      initialization_parameters:
        thermalize_fast: true
        quasineutrality: true

      # If the width of the pedestal has changed, modify the BC (last in predicted_rX) for PORTALS accordingly
      change_last_radial_call: true

      # Keep the absolute value of the original case as the base to compute relative residuals in subsequent optimizations
      use_previous_residual: true # Should be set to false if an absolute residual convergence metric is defined in optimization_options

      # Later beats to utilize past beats surrogate data if available (e.g. if position has not changed)
      use_previous_surrogate_data: true

      # Use previous exploration ranges to limit the new exploration ranges (good to avoid cases in which a portals beat reports a zero gradient)
      use_previous_ranges: true 

      # If surrogates exist, use them to find the first training point (and limit to only one point)
      try_flux_match_only_for_first_point: true

      # If element is not exactly in radiation database, search for closest one
      enforce_impurity_radiation_existence: true

    preprocess_prepare: import::mitim_modules.maestro.utils.PORTALSbeat.preprocess_prepare_portals
    preprocess_prepare_parameters:
      # By default, run PORTALS with all impurities lumped into one species
      lumpImpurities: true
      # By default, enforce that all species have the same density gradient
      enforce_same_density_gradients: true
    preprocess_run: null

  portals_soft:

    beat_type: portals

    base_module: portals

    parameters_prepare:

      portals_parameters:
        target:
          options:
            targets_evolve: ["qie"]
        optimization_options:
          convergence_options:
            maximum_iterations: 15
            stopping_criteria_parameters:
              maximum_value: 10.e-3                 # Reducing residual by 1/0.01 = 100x sufficient for a soft PORTALS run
              minimum_dvs_variation: [10, 3, 1.0]   # A more relaxed variation for soft PORTALS run
              ricci_value: 0.15                     # A more relaxed Ricci value for soft PORTALS run
          strategy_options:
            AllowedExcursions: [0.0, 0.0]           # In case the soft beat makes things too negative when they shoudn't be


  transp:

    beat_type: transp

    base_module: null

    parameters_prepare:

      # Machine to initialize TRANSP equilibrium, and time (s) to transition to MAESTRO plasma
      machine_initialization: CMOD  # Machine to initialize TRANSP equilibrium
      transition_window: 0.1        # Time (s) to transition to MAESTRO plasma from the machine_initialization
      currentheating_window: 0.001  # Time (s) to turn on current diffusion and heating once transitioned
      machine_initialization_match_target: false # If true, ease initialization, match qstar and p0/B0^2 of initialization machine to target plasma

      # Simulation length
      flattop_window: 2.5   

      # TRANSP namelist parameters
      useNUBEAMforAlphas: True
      Pich: True
      dtOut_ms : 10.0
      dtIn_ms : 10.0
      nzones : 60
      nzones_energetic : 20
      nzones_distfun : 10    
      MCparticles : 1.e+4
      toric_ntheta : 64  
      toric_nrho : 128

      # Extract TORIC & NUBEAM additional files for post-analysis
      extractAC: False     
      time_before_end: 0.001

    # Function to modify parameters of the namelist based on the rest of namelist
    preprocess_prepare: import::mitim_modules.maestro.utils.TRANSPbeat.preprocess_prepare_transp
    preprocess_prepare_parameters:
      cpus_toric: null  # if null: use as many as available for this MAESTRO job
      cpus_nubeam: null # if null: use as many as available for this MAESTRO job
    preprocess_run: import::mitim_modules.maestro.utils.TRANSPbeat.preprocess_run_transp

  transp_soft:

    beat_type: transp

    base_module: transp

    # A soft TRANSP beat must be just for current diffusion, no alphas nor ICRF
    parameters_prepare:

        flattop_window: 20.0 # Long flattop to allow for current diffusion

        Pich: False
        useNUBEAMforAlphas: False
      
        dtEquilMax_ms: 100.0
        dtHeating_ms: 100.0
        dtCurrentDiffusion_ms: 100.0
        dtOut_ms: 100.0
        dtIn_ms: 100.0
     
  transp_final:

    beat_type: transp

    base_module: transp

    # A final TRANSP beat must be as a normal TRANSP beat, but extracting AC files
    parameters_prepare:

        extractAC: True
        